id: cortex-assistant-verification
version: 3.0.1
inputs:
  api_version: ${{ inputs.api_version }}
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.target_directory }}
  candidate: ${{ inputs.candidate }}
  base: ${{ inputs.base }}
  documents: ${{ inputs.documents }}
  settings: ${{ inputs.settings }}
sequence:
- id: verify
  execution_needs:
    packages: [nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#go]
  op: command_execution
  const: true
  inputs:
    timeout: 40m
    run: |
      set -eu
      python3 "$WORKTREE/.c2/recipes/hooks/build/verify.py"
    env:
      WORKTREE: ${{ context.environment.op.worktree_path }}
      DIRECTORY: ${{ inputs.target_directory }}
      CANDIDATE: ${{ inputs.candidate }}
      API_VERSION: ${{ inputs.api_version }}
      OUTBOX: ${{ context.environment.op.outbox }}
outputs:
  api_version: c2.build-hook/v1
  status: ${{ json_parse(sequence.verify.outputs.stdout).status }}
  summary: ${{ json_parse(sequence.verify.outputs.stdout).summary }}
  artifact_refs: >-
    ${{ jq(sequence.verify.artifacts, 'del(.["__git_state_thin_pack__"], .["diff_from_parent.diff"], .["diff_from_base.diff"]) | . as $refs | with_entries(select(.key == "verification-evidence.json" or .key == "evidence-index.md" or .key == "case-index.json" or .key == "candidate-manifest.json")) + {"artifact-catalog.json": {"kind": "value", "name": "artifact-catalog.json", "format": "json", "value": $refs}}') }}
