id: cortex-assistant-session
schema_version: 2
version: "3.0.0"
desc: A conversation is the custom view of this job's recorded task data.
input_schema:
  protocol: {type: string, default_value: cortex-assistant/3}
  session_id: {type: string}
  prompt: {type: string}
  snapshot: {type: object, required: true}
  base_url: {type: string, required: true}
  api_key: {type: string, secret: true, required: true}
  provider: {type: string, required: true}
  model: {type: string, required: true}
inputs:
  protocol: '${{ inputs.protocol }}'
  session_id: '${{ inputs.session_id }}'
  prompt: '${{ inputs.prompt }}'
  snapshot: '${{ inputs.snapshot }}'
  base_url: '${{ inputs.base_url }}'
  api_key: '${{ inputs.api_key }}'
  provider: '${{ inputs.provider }}'
  model: '${{ inputs.model }}'

state:
  initial: capture
  states:
    capture:
      inputs:
        session_id: '${{ inputs.session_id }}'
        prompt: '${{ inputs.prompt }}'
        snapshot: '${{ inputs.snapshot }}'
      sequence:
        - id: capture
          op: ./ops/discussion
          inputs:
            action: capture
            session_id: '${{ inputs.session_id }}'
            prompt: '${{ inputs.prompt }}'
            snapshot: '${{ inputs.snapshot }}'
      transitions:
        - to: infer
          when: 'true'
    infer:
      inputs:
        base_url: '${{ inputs.base_url }}'
        api_key: '${{ inputs.api_key }}'
        provider: '${{ inputs.provider }}'
        model: '${{ inputs.model }}'
      sequence:
        - id: assemble
          op: ./ops/discussion
          inputs: {action: assemble}
        - id: infer
          include: ./inference.yaml
          inputs:
            base_url: '${{ inputs.base_url }}'
            api_key: '${{ inputs.api_key }}'
            provider: '${{ inputs.provider }}'
            model: '${{ inputs.model }}'
            prompt: '${{ sequence.assemble.outputs.model_input.prompt }}'
            response_schema: '${{ sequence.assemble.outputs.model_input.response_schema }}'
          catch:
            - id: model-failure-to-input
              when: 'true'
              continue:
                outputs:
                  response: '{}'
                  model: unavailable
                  usage: {}
        - id: response
          op: ./ops/discussion
          inputs:
            action: response
            model:
              response: '${{ sequence.infer.outputs.response }}'
              model: '${{ sequence.infer.outputs.model }}'
              usage: '${{ sequence.infer.outputs.usage }}'
      transitions:
        - to: prompt
          when: 'true'
    prompt:
      sequence:
        - id: form
          op: ./ops/discussion
          inputs: {action: form}
        - id: await-human
          op: input
          inputs:
            form: '${{ sequence.form.outputs.form }}'
        - id: accept
          op: ./ops/discussion
          inputs: {action: accept}
      outputs:
        command: '${{ sequence.accept.outputs.command.command }}'
      transitions:
        - to: done
          when: 'states.prompt.outputs.command == "finish"'
        - to: infer
          when: 'states.prompt.outputs.command == "send"'
        - to: prompt
          when: 'true'
    done:
      sequence: []
outputs:
  session_id: '${{ inputs.session_id }}'
  status: finished
